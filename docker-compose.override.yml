# Docker Compose override for local development
# This file is automatically used by docker-compose for local development
# It provides specific port mappings for local testing

version: '3.8'

services:
  frontend:
    ports:
      - "3911:3911"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8953

  backend:
    ports:
      - "8953:8953"
    environment:
      - NODE_ENV=development
      - ADK_LOG_LEVEL=DEBUG

  db-migrate:
    # Migration runs once in development
    profiles:
      - tools