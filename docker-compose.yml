version: '3.8'

services:
  # Frontend Service - Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    expose:
      - "3911"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3911
      - HOSTNAME=0.0.0.0
      
      # Supabase Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      
      # Contact Configuration
      - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL:-asim@consulting.sa}
      
      # Analytics
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
      
      # Backend URL for API calls
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8953
      
      # SSL Configuration
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://site.consulting.sa}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-https://admin.consulting.sa}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3911/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # Backend Service - Python Agent
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    expose:
      - "8953"
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app/agent
      - ADK_AGENT_PORT=8953
      - ADK_LOG_LEVEL=${ADK_LOG_LEVEL:-INFO}
      
      # Database Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      
      # AI Services
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Stripe Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      
      # Livekit Configuration
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      
      # n8n Configuration
      - N8N_URL=${N8N_URL}
      - N8N_BASE_URL=${N8N_BASE_URL}
      - N8N_API_KEY=${N8N_API_KEY}
      
      # MCP Configuration
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:8000}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8000}
      - N8N_MCP_PORT=${N8N_MCP_PORT:-8003}
      
      # GitHub Integration (for MCP)
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8953/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # Database Migration Service (runs once)
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    restart: "no"


networks:
  default:
    name: ai-saas-network

# Health check configuration
x-healthcheck-config: &healthcheck
  interval: 30s
  timeout: 15s
  retries: 3
  start_period: 60s