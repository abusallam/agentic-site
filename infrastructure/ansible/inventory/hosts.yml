---
all:
  children:
    staging:
      hosts:
        staging-server:
          ansible_host: "{{ staging_host }}"
          ansible_user: "{{ staging_user }}"
          ansible_ssh_private_key_file: "{{ staging_ssh_key }}"
          environment: staging
          domain: staging.consulting.sa
          
    production:
      hosts:
        production-server:
          ansible_host: "{{ production_host }}"
          ansible_user: "{{ production_user }}"
          ansible_ssh_private_key_file: "{{ production_ssh_key }}"
          environment: production
          domain: consulting.sa
          
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'