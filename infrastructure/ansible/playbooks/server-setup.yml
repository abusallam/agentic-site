---
- name: Setup VPS for Agentic AI Platform
  hosts: all
  become: yes
  vars:
    docker_compose_version: "2.21.0"
    node_version: "18"
    python_version: "3.11"
    
  tasks:
    - name: Update system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600
      tags: [system]

    - name: Install required system packages
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - ufw
          - fail2ban
          - htop
          - vim
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present
      tags: [system, packages]

    - name: Create deployment user
      user:
        name: deploy
        groups: sudo,docker
        shell: /bin/bash
        create_home: yes
        append: yes
      tags: [users]

    - name: Setup SSH key for deploy user
      authorized_key:
        user: deploy
        key: "{{ lookup('file', ansible_ssh_private_key_file + '.pub') }}"
        state: present
      tags: [users, ssh]

    - name: Configure sudo for deploy user
      lineinfile:
        path: /etc/sudoers.d/deploy
        line: 'deploy ALL=(ALL) NOPASSWD:ALL'
        create: yes
        mode: '0440'
      tags: [users]

    - name: Install Docker
      block:
        - name: Add Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker repository
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: Install Docker
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
            state: present
            update_cache: yes

        - name: Start and enable Docker
          systemd:
            name: docker
            state: started
            enabled: yes

        - name: Add deploy user to docker group
          user:
            name: deploy
            groups: docker
            append: yes
      tags: [docker]

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      tags: [docker]

    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: deploy
        group: deploy
        mode: '0755'
      loop:
        - /opt/agentic-{{ environment }}
        - /opt/backups
        - /var/log/agentic
        - /etc/agentic
      tags: [directories]

    - name: Configure UFW firewall
      block:
        - name: Reset UFW to defaults
          ufw:
            state: reset

        - name: Allow SSH
          ufw:
            rule: allow
            port: '22'
            proto: tcp

        - name: Allow HTTP
          ufw:
            rule: allow
            port: '80'
            proto: tcp

        - name: Allow HTTPS
          ufw:
            rule: allow
            port: '443'
            proto: tcp

        - name: Enable UFW
          ufw:
            state: enabled
            policy: deny
            direction: incoming
      tags: [firewall]

    - name: Configure fail2ban
      block:
        - name: Create fail2ban jail for SSH
          copy:
            content: |
              [sshd]
              enabled = true
              port = ssh
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.d/sshd.conf
            mode: '0644'

        - name: Create fail2ban jail for nginx
          copy:
            content: |
              [nginx-http-auth]
              enabled = true
              filter = nginx-http-auth
              port = http,https
              logpath = /var/log/nginx/error.log
              maxretry = 5
              bantime = 3600

              [nginx-limit-req]
              enabled = true
              filter = nginx-limit-req
              port = http,https
              logpath = /var/log/nginx/error.log
              maxretry = 10
              bantime = 600
            dest: /etc/fail2ban/jail.d/nginx.conf
            mode: '0644'

        - name: Start and enable fail2ban
          systemd:
            name: fail2ban
            state: restarted
            enabled: yes
      tags: [security]

    - name: Configure system limits
      block:
        - name: Set file descriptor limits
          lineinfile:
            path: /etc/security/limits.conf
            line: "{{ item }}"
          loop:
            - "* soft nofile 65536"
            - "* hard nofile 65536"
            - "deploy soft nofile 65536"
            - "deploy hard nofile 65536"

        - name: Configure sysctl for performance
          sysctl:
            name: "{{ item.key }}"
            value: "{{ item.value }}"
            state: present
            reload: yes
          loop:
            - { key: "vm.max_map_count", value: "262144" }
            - { key: "fs.file-max", value: "2097152" }
            - { key: "net.core.somaxconn", value: "65535" }
            - { key: "net.ipv4.tcp_max_syn_backlog", value: "65535" }
      tags: [performance]

    - name: Setup log rotation
      copy:
        content: |
          /var/log/agentic/*.log {
              daily
              missingok
              rotate 14
              compress
              delaycompress
              notifempty
              create 0644 deploy deploy
              postrotate
                  systemctl reload nginx > /dev/null 2>&1 || true
              endscript
          }
        dest: /etc/logrotate.d/agentic
        mode: '0644'
      tags: [logging]

    - name: Install monitoring tools
      apt:
        name:
          - htop
          - iotop
          - nethogs
          - ncdu
          - tree
        state: present
      tags: [monitoring]

    - name: Setup backup script
      copy:
        content: |
          #!/bin/bash
          set -e
          
          BACKUP_DIR="/opt/backups"
          APP_DIR="/opt/agentic-{{ environment }}"
          DATE=$(date +%Y%m%d_%H%M%S)
          BACKUP_NAME="agentic_backup_${DATE}"
          
          # Create backup directory
          mkdir -p "${BACKUP_DIR}/${BACKUP_NAME}"
          
          # Backup application files
          if [ -d "$APP_DIR" ]; then
              cp -r "$APP_DIR" "${BACKUP_DIR}/${BACKUP_NAME}/app"
          fi
          
          # Backup Docker volumes (if any)
          docker volume ls -q | while read volume; do
              if [[ $volume == *"agentic"* ]]; then
                  docker run --rm -v "$volume":/data -v "${BACKUP_DIR}/${BACKUP_NAME}":/backup alpine tar czf "/backup/${volume}.tar.gz" -C /data .
              fi
          done
          
          # Compress backup
          cd "$BACKUP_DIR"
          tar czf "${BACKUP_NAME}.tar.gz" "$BACKUP_NAME"
          rm -rf "$BACKUP_NAME"
          
          # Keep only last 10 backups
          ls -t *.tar.gz | tail -n +11 | xargs -r rm
          
          echo "Backup completed: ${BACKUP_NAME}.tar.gz"
        dest: /usr/local/bin/backup-agentic
        mode: '0755'
        owner: root
        group: root
      tags: [backup]

    - name: Setup backup cron job
      cron:
        name: "Agentic backup"
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/backup-agentic >> /var/log/agentic/backup.log 2>&1"
        user: deploy
      tags: [backup]

    - name: Configure nginx basic setup
      block:
        - name: Remove default nginx site
          file:
            path: /etc/nginx/sites-enabled/default
            state: absent

        - name: Create nginx log directory
          file:
            path: /var/log/nginx
            state: directory
            owner: www-data
            group: adm
            mode: '0755'

        - name: Start and enable nginx
          systemd:
            name: nginx
            state: started
            enabled: yes
      tags: [nginx]

    - name: Setup SSL certificate (Let's Encrypt)
      block:
        - name: Check if certificate exists
          stat:
            path: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
          register: cert_exists

        - name: Create temporary nginx config for certificate
          copy:
            content: |
              server {
                  listen 80;
                  server_name {{ domain }};
                  
                  location /.well-known/acme-challenge/ {
                      root /var/www/html;
                  }
                  
                  location / {
                      return 301 https://$server_name$request_uri;
                  }
              }
            dest: /etc/nginx/sites-available/temp-ssl
            mode: '0644'
          when: not cert_exists.stat.exists

        - name: Enable temporary nginx config
          file:
            src: /etc/nginx/sites-available/temp-ssl
            dest: /etc/nginx/sites-enabled/temp-ssl
            state: link
          when: not cert_exists.stat.exists

        - name: Reload nginx for certificate generation
          systemd:
            name: nginx
            state: reloaded
          when: not cert_exists.stat.exists

        - name: Generate SSL certificate
          command: >
            certbot certonly --webroot -w /var/www/html
            -d {{ domain }}
            --email admin@{{ domain }}
            --agree-tos --non-interactive
          when: not cert_exists.stat.exists and environment == 'production'

        - name: Setup certificate renewal cron
          cron:
            name: "Renew SSL certificates"
            minute: "0"
            hour: "12"
            job: "/usr/bin/certbot renew --quiet && systemctl reload nginx"
            user: root
          when: environment == 'production'
      tags: [ssl]
      when: environment == 'production'

    - name: Final system cleanup
      block:
        - name: Clean package cache
          apt:
            autoclean: yes
            autoremove: yes

        - name: Update locate database
          command: updatedb
          ignore_errors: yes
      tags: [cleanup]

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted