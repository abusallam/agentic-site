version: '3.8'

services:
  # Frontend Service - Next.js Staging
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/consulting-sa/agentic-frontend:staging}
    container_name: agentic-frontend-staging
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=staging
      - NEXT_TELEMETRY_DISABLED=1
      
      # Supabase Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      
      # Contact Configuration
      - NEXT_PUBLIC_CONTACT_EMAIL=${NEXT_PUBLIC_CONTACT_EMAIL:-asim@consulting.sa}
      
      # Analytics
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
      
      # Backend URL for API calls
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      
      # Staging Site Configuration
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://staging.consulting.sa}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-http://staging.consulting.sa:8000}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agentic-network

  # Backend Service - Python Agent Staging
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/consulting-sa/agentic-backend:staging}
    container_name: agentic-backend-staging
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=staging
      - PYTHONPATH=/app/agent
      - ADK_AGENT_PORT=8000
      - ADK_LOG_LEVEL=${ADK_LOG_LEVEL:-DEBUG}
      
      # Database Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # AI Services
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Payment Integration (staging keys)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      
      # Communication Services
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      
      # Workflow Automation
      - N8N_URL=${N8N_URL}
      - N8N_BASE_URL=${N8N_BASE_URL}
      - N8N_API_KEY=${N8N_API_KEY}
      
      # MCP Server Configuration
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:8000}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8000}
      - N8N_MCP_PORT=${N8N_MCP_PORT:-8003}
      
      # GitHub Integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agentic-network

  # Redis Cache for Staging
  redis:
    image: redis:7-alpine
    container_name: agentic-redis-staging
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agentic-network

  # Nginx reverse proxy for staging
  nginx:
    image: nginx:alpine
    container_name: agentic-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge
    name: agentic-staging-network

volumes:
  redis_data:
    driver: local