[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:frontend]
command=sh -c "cd /app/frontend && if [ \"$NODE_ENV\" = \"development\" ]; then npm run dev; else npm start; fi"
directory=/app/frontend
user=appuser
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/frontend.err.log
stdout_logfile=/var/log/supervisor/frontend.out.log
environment=PORT="3000",HOSTNAME="0.0.0.0"

[program:n8n-platform]
command=sh -c "cd /app/n8n-platform && ./packages/cli/bin/n8n start"
directory=/app/n8n-platform
user=appuser
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/n8n-platform.err.log
stdout_logfile=/var/log/supervisor/n8n-platform.out.log
environment=N8N_HOST="0.0.0.0",N8N_PORT="5678",N8N_PROTOCOL="http"

[program:n8n-mcp]
command=sh -c "cd /app/n8n-mcp && node dist/index.js"
directory=/app/n8n-mcp
user=appuser
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/n8n-mcp.err.log
stdout_logfile=/var/log/supervisor/n8n-mcp.out.log
environment=PORT="3001",N8N_API_URL="http://localhost:5678"

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface