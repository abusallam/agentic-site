version: '3.8'

services:
  # Frontend Service - Next.js for development
  frontend-dev:
    image: ${FRONTEND_IMAGE:-ghcr.io/consulting-sa/agentic-frontend:development}
    container_name: agentic-frontend-dev
    ports:
      - "3001:3000"  # Map to port 3001 for development separation
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=https://dev.consulting.sa/api
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      
    depends_on:
      - backend-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agentic-dev-network

  # Backend Service - Python Agent Development
  backend-dev:
    image: ${BACKEND_IMAGE:-ghcr.io/consulting-sa/agentic-backend:development}
    container_name: agentic-backend-dev
    ports:
      - "8001:8000"  # Map to port 8001 for development separation
    environment:
      - NODE_ENV=development
      - PYTHONPATH=/app/agent
      - ADK_AGENT_PORT=8000
      - ADK_LOG_LEVEL=${ADK_LOG_LEVEL:-DEBUG}
      
      # Database Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # AI Services
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      
      # Payment Integration (development keys)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      
      # Communication Services
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      
      # Workflow Automation
      - N8N_URL=${N8N_URL}
      - N8N_BASE_URL=${N8N_BASE_URL}
      - N8N_API_KEY=${N8N_API_KEY}
      
      # MCP Server Configuration
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:8000}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8000}
      - N8N_MCP_PORT=${N8N_MCP_PORT:-8003}
      
      # GitHub Integration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agentic-dev-network

  # Redis Cache for Development
  redis-dev:
    image: redis:7-alpine
    container_name: agentic-redis-dev
    ports:
      - "6380:6379"  # Map to port 6380 for development separation
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agentic-dev-network

  # n8n Workflow Automation for Development
  n8n-dev:
    image: n8nio/n8n:latest
    container_name: agentic-n8n-dev
    ports:
      - "5679:5678"  # Map to port 5679 for development separation
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - agentic-dev-network

networks:
  agentic-dev-network:
    driver: bridge
    name: agentic-dev-network

volumes:
  redis_data:
    driver: local
  n8n_data:
    driver: local