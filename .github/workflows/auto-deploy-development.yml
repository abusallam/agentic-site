name: Auto Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        
    - name: Deploy to Development VPS
      run: |
        # Add VPS to known hosts
        ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
        
        # Run deployment on VPS
        ssh ${{ secrets.VPS_SSH_ALIAS }} "
          cd /opt/docker-apps/development/agentic-site
          git pull origin develop
          docker-compose down
          docker-compose up -d --build
          echo 'Deployment completed at \$(date)'
        "
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ Deployment to development successful"
        else
          echo "❌ Deployment to development failed"
        fi
