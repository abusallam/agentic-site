name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (mock, live, hybrid)'
        required: false
        default: 'mock'
        type: choice
        options:
        - mock
        - live
        - hybrid

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-mode: [mock]
        # Add 'live' to matrix for production testing when ready
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install uv (Python package manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install Python dependencies
      working-directory: ./agent
      run: |
        uv sync
        uv pip install pytest pytest-asyncio pytest-cov
    
    - name: Install Node.js dependencies
      run: |
        npm ci
    
    - name: Set up test environment variables
      run: |
        echo "TEST_MODE=${{ matrix.test-mode }}" >> $GITHUB_ENV
        echo "TEST_DB_MODE=mock" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}/agent" >> $GITHUB_ENV
    
    - name: Create test directories
      run: |
        mkdir -p agent/tests/reports
        mkdir -p agent/tests/coverage
    
    - name: Run integration tests
      working-directory: ./agent
      run: |
        # Run the comprehensive integration test suite
        uv run python tests/integration/test_runner.py \
          --mode ${{ matrix.test-mode }} \
          --verbose \
          --output tests/reports/integration-results.json \
          --report tests/reports/integration-report.txt
    
    - name: Run pytest integration tests
      working-directory: ./agent
      run: |
        # Run pytest-based integration tests
        uv run pytest tests/integration/ \
          -v \
          --cov=my_adk_agent \
          --cov-report=html:tests/coverage/html \
          --cov-report=xml:tests/coverage/coverage.xml \
          --cov-report=term \
          --junit-xml=tests/reports/pytest-results.xml
      continue-on-error: true
    
    - name: Run service connection tests
      working-directory: ./agent
      run: |
        # Run specific service connection tests
        uv run python tests/integration/test_service_connections.py
      continue-on-error: true
    
    - name: Run database tests
      working-directory: ./agent
      run: |
        # Run database integration tests
        uv run python tests/fixtures/test_database.py
      continue-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results-${{ matrix.test-mode }}
        path: |
          agent/tests/reports/
          agent/tests/coverage/
        retention-days: 30
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always()
      with:
        file: ./agent/tests/coverage/coverage.xml
        flags: integration
        name: integration-tests-${{ matrix.test-mode }}
    
    - name: Comment PR with test results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          const path = './agent/tests/reports/integration-report.txt';
          
          if (fs.existsSync(path)) {
            const report = fs.readFileSync(path, 'utf8');
            const body = `## Integration Test Results (${{ matrix.test-mode }} mode)
            
            \`\`\`
            ${report}
            \`\`\`
            
            Full test artifacts are available in the workflow run.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
          }

  test-summary:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    
    steps:
    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        pattern: integration-test-results-*
        merge-multiple: true
        path: ./test-results
    
    - name: Generate test summary
      run: |
        echo "# Integration Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if test results exist
        if [ -f "./test-results/integration-report.txt" ]; then
          echo "## Test Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ./test-results/integration-report.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ No test report found" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Test reports and coverage data are available as workflow artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage reports are uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
    
    - name: Check test status
      run: |
        # This job will fail if any integration tests failed
        if [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Integration tests failed"
          exit 1
        else
          echo "✅ All integration tests passed"
        fi

  notify-slack:
    runs-on: ubuntu-latest
    needs: [integration-tests, test-summary]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ needs.integration-tests.result }}
        channel: '#ci-cd-notifications'
        text: |
          Integration Tests ${{ needs.integration-tests.result == 'success' && '✅ PASSED' || '❌ FAILED' }}
          
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}