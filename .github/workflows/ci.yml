name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests
        run: npm run test:ci

      - name: Build application
        run: npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: frontend

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./agent
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest --cov=. --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./agent/coverage.xml
          flags: backend

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          cd agent
          uv sync
          uv pip install pytest pytest-asyncio pytest-cov

      - name: Setup test environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> .env
          echo "NODE_ENV=test" >> .env
          echo "TEST_MODE=mock" >> .env
          echo "TEST_DB_MODE=postgres" >> .env
          echo "TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db" >> .env

      - name: Create test directories
        run: |
          mkdir -p agent/tests/reports
          mkdir -p agent/tests/coverage

      - name: Run comprehensive integration test suite
        working-directory: ./agent
        run: |
          # Run the comprehensive integration test runner
          uv run python tests/integration/test_runner.py \
            --mode mock \
            --verbose \
            --output tests/reports/integration-results.json \
            --report tests/reports/integration-report.txt

      - name: Run pytest integration tests
        working-directory: ./agent
        run: |
          # Run pytest-based integration tests with coverage
          uv run pytest tests/integration/ \
            -v \
            --cov=my_adk_agent \
            --cov-report=html:tests/coverage/html \
            --cov-report=xml:tests/coverage/coverage.xml \
            --cov-report=term \
            --junit-xml=tests/reports/pytest-results.xml
        continue-on-error: true

      - name: Run service connection tests
        working-directory: ./agent
        run: |
          # Run specific service connection tests
          uv run python tests/integration/test_service_connections.py
        continue-on-error: true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            agent/tests/reports/
            agent/tests/coverage/
          retention-days: 30

      - name: Upload integration coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./agent/tests/coverage/coverage.xml
          flags: integration
          name: integration-tests

  build-check:
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, security-scan, integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: agentic-frontend:test

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./Dockerfile.backend
          push: false
          tags: agentic-backend:test

      - name: Test Docker Compose
        run: |
          cp .env.example .env
          docker-compose -f docker-compose.yml config