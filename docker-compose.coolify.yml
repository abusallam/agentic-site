# Coolify-specific Docker Compose configuration
# This file extends the base docker-compose.yml for Coolify deployment

version: '3.8'

services:
  frontend:
    # Override for Coolify deployment
    environment:
      # Coolify-specific environment variables
      - COOLIFY_DEPLOYMENT=true
      - BACKEND_URL=http://backend:8080
    labels:
      # Coolify management labels (let Coolify handle Traefik configuration)
      - "coolify.managed=true"
      - "coolify.name=ai-saas-platform"
      - "coolify.type=application"
      - "coolify.framework=nextjs"
      
      # Domain configuration for Coolify
      - "coolify.domains=site.consulting.sa,admin.consulting.sa"
      - "coolify.ssl=true"
      - "coolify.redirect=true"
      
      # Health check configuration
      - "coolify.healthcheck.enabled=true"
      - "coolify.healthcheck.path=/api/health"
      - "coolify.healthcheck.port=3000"
      - "coolify.healthcheck.interval=30s"
      
      # Load balancer configuration
      - "coolify.port=3000"

  backend:
    # Backend service configuration for Coolify
    environment:
      - COOLIFY_DEPLOYMENT=true
    labels:
      - "coolify.managed=true"
      - "coolify.name=ai-saas-backend"
      - "coolify.type=application"
      - "coolify.framework=python"
      
      # Internal service (not exposed to public)
      - "coolify.internal=true"
      
      # Health check
      - "coolify.healthcheck.enabled=true"
      - "coolify.healthcheck.path=/api/health"
      - "coolify.healthcheck.port=8080"
      - "coolify.healthcheck.interval=30s"

  db-migrate:
    # Migration service - runs once
    labels:
      - "coolify.managed=true"
      - "coolify.name=ai-saas-migrate"
      - "coolify.type=oneshot"
      - "coolify.runonce=true"

# Coolify network configuration
networks:
  default:
    external: true
    name: coolify

# Resource limits for Coolify
x-deploy: &deploy-config
  resources:
    limits:
      memory: 1G
      cpus: '0.5'
    reservations:
      memory: 256M
      cpus: '0.1'