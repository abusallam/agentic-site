[project]
name = "consulting-sa-agents"
version = "0.1.0"
description = "Multi-agent system for consulting.sa"
authors = [
    {name = "consulting.sa", email = "cto@consulting.sa"}
]
requires-python = ">=3.11"
dependencies = [
    # Core AI frameworks
    "google-generativeai>=0.8.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pydantic-ai>=0.0.14",
    # Database and storage
    "supabase>=2.7.0",
    "psycopg2-binary>=2.9.0",
    # Web and API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    # Real-time communication
    "PyJWT>=2.9.0",
    "livekit>=0.12.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "typing-extensions>=4.12.0",
    # Development and testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "flake8>=7.1.0",
    "mypy>=1.11.0",
    "email-validator>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
